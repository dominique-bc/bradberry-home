<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bradberry Home</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAF7F2;--warm:#FDF9F4;--dark:#2C1A0E;--mid:#6B3F1F;--light:#C49A6C;
  --d:#C2602A;--c:#4A7C6F;--b:#8B6BB1;--pa:#4A6FA5;--done:#3A9E5F;
  --judah:#3A7BD5;--liam:#E8543A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--dark);min-height:100vh;padding-bottom:90px;}

/* HEADER */
.hdr{background:var(--dark);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
.hdr h1{font-family:'DM Serif Display',serif;color:var(--cream);font-size:1.25rem;margin:0;}
.hdr-right{display:flex;gap:8px;align-items:center;}
.edit-btn{background:rgba(196,154,108,0.2);border:1.5px solid rgba(196,154,108,0.4);color:var(--light);font-family:'DM Sans',sans-serif;font-size:0.68rem;font-weight:600;padding:4px 12px;border-radius:20px;cursor:pointer;}
.edit-btn.on{background:var(--d);border-color:var(--d);color:white;}
.ss{font-size:0.6rem;color:var(--light);opacity:0.8;}

/* MAIN TABS */
.main-tabs{display:flex;background:#3d2410;}
.main-tab{flex:1;padding:9px 4px;text-align:center;font-size:0.6rem;font-weight:600;color:var(--light);cursor:pointer;border:none;background:transparent;font-family:'DM Sans',sans-serif;letter-spacing:0.03em;text-transform:uppercase;transition:all 0.15s;}
.main-tab.on{background:var(--cream);color:var(--dark);border-radius:8px 8px 0 0;margin:4px 4px 0;}
.main-tab.judah-tab.on{background:#EEF3FF;color:var(--judah);}
.main-tab.liam-tab.on{background:#FFF0EE;color:var(--liam);}

/* LEGEND */
.legend{display:flex;gap:8px;justify-content:center;padding:8px 12px;background:var(--warm);flex-wrap:wrap;border-bottom:1px solid rgba(196,154,108,0.15);}
.leg{display:flex;align-items:center;gap:3px;font-size:0.66rem;font-weight:600;color:#555;}
.leg-dot{width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.5rem;font-weight:800;color:white;}

/* ADULT TODAY */
.today-view{padding:14px;}
.today-date{font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--dark);margin-bottom:3px;}
.today-sub{font-size:0.72rem;color:#888;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.05em;}
.prog-track{background:rgba(196,154,108,0.15);border-radius:20px;height:5px;margin-bottom:16px;overflow:hidden;}
.prog-fill{height:100%;background:var(--done);border-radius:20px;transition:width 0.4s;}
.sec-lbl{font-size:0.6rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--light);margin:12px 0 5px;}
.t-card{background:white;border-radius:12px;border:0.5px solid rgba(196,154,108,0.2);padding:13px 14px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:8px;}
.t-card.done{opacity:0.5;}
.t-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.t-emoji{font-size:1.1rem;width:24px;flex-shrink:0;text-align:center;}
.t-name{font-size:0.92rem;font-weight:500;color:var(--dark);white-space:normal;word-break:break-word;}
.t-name.struck{text-decoration:line-through;}
.t-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.owner-pill{padding:3px 10px;border-radius:20px;font-size:0.65rem;font-weight:700;color:white;white-space:nowrap;}
.chk{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0;}
.chk-off{background:rgba(196,154,108,0.15);color:var(--light);}
.chk-on{background:var(--done);color:white;}
.empty{text-align:center;padding:40px 20px;color:#888;font-size:0.85rem;line-height:1.6;}
.reset-btn-wrap{text-align:center;margin-top:10px;}
.reset-btn{background:transparent;border:1.5px solid rgba(58,158,95,0.4);color:var(--done);font-family:'DM Sans',sans-serif;font-size:0.7rem;font-weight:600;padding:5px 14px;border-radius:20px;cursor:pointer;}

/* ADULT WEEK GRID */
.cat-tabs{display:flex;overflow-x:auto;gap:5px;padding:8px 12px;scrollbar-width:none;background:#f5f0e8;}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{flex-shrink:0;padding:4px 10px;border-radius:20px;border:1px solid rgba(196,154,108,0.3);background:transparent;font-family:'DM Sans',sans-serif;font-size:0.64rem;font-weight:600;color:var(--mid);cursor:pointer;white-space:nowrap;}
.cat-tab.on{background:var(--dark);color:var(--cream);border-color:var(--dark);}
.grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.grid{border-collapse:collapse;min-width:100%;}
.th-corner{position:sticky;left:0;z-index:3;background:var(--warm);width:105px;min-width:105px;padding:6px 6px 6px 10px;font-size:0.55rem;font-weight:700;color:var(--light);text-transform:uppercase;letter-spacing:0.07em;border-bottom:2px solid rgba(196,154,108,0.2);border-right:2px solid rgba(196,154,108,0.18);}
.th-day{min-width:40px;width:40px;text-align:center;padding:6px 2px;font-size:0.56rem;font-weight:700;text-transform:uppercase;color:var(--light);border-bottom:2px solid rgba(196,154,108,0.2);}
.th-day.today{color:var(--d);}
.td-task{position:sticky;left:0;z-index:2;background:var(--warm);width:105px;min-width:105px;max-width:105px;padding:8px 6px 8px 10px;font-size:0.68rem;font-weight:500;border-bottom:1px solid rgba(196,154,108,0.12);border-right:2px solid rgba(196,154,108,0.18);vertical-align:middle;color:var(--dark);}
.task-name-row{display:flex;align-items:flex-start;gap:4px;}
.task-emoji{font-size:0.8rem;flex-shrink:0;margin-top:1px;}
.task-name-txt{white-space:normal;word-break:break-word;overflow-wrap:break-word;line-height:1.35;}
.task-actions{display:none;gap:3px;margin-top:5px;}
.edit-active .task-actions{display:flex;}
.act-btn{font-size:0.55rem;font-weight:600;padding:2px 6px;border-radius:5px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;}
.act-rename{background:rgba(196,154,108,0.18);color:var(--mid);}
.act-delete{background:rgba(194,96,42,0.1);color:var(--d);}
.td-cell{width:40px;min-width:40px;text-align:center;vertical-align:middle;border-bottom:1px solid rgba(196,154,108,0.1);border-right:1px solid rgba(196,154,108,0.08);cursor:pointer;padding:9px 0;}
.dot{width:30px;height:30px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:0.5rem;font-weight:800;color:white;transition:all 0.15s;}
.o-none{background:transparent;border:2px dashed rgba(196,154,108,0.22);color:transparent;}
.o-D{background:var(--d);}.o-C{background:var(--c);}.o-B{background:var(--b);}.o-PA{background:var(--pa);}.o-done{background:var(--done);font-size:0.85rem;}
.sec-row td{background:var(--cream);padding:7px 10px 3px;font-size:0.58rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--light);border-bottom:1px solid rgba(196,154,108,0.12);}
.add-row td{padding:8px 12px;}
.add-btn{display:flex;align-items:center;gap:5px;background:transparent;border:1.5px dashed rgba(196,154,108,0.3);border-radius:8px;padding:7px 12px;font-family:'DM Sans',sans-serif;font-size:0.75rem;color:var(--light);cursor:pointer;width:100%;}

/* STATS BAR */
.stats-bar{display:flex;justify-content:space-around;padding:9px 10px;background:var(--dark);}
.stat{display:flex;flex-direction:column;align-items:center;gap:1px;}
.stat-num{font-family:'DM Serif Display',serif;font-size:1rem;color:var(--light);}
.stat-lbl{font-size:0.48rem;color:rgba(250,247,242,0.4);text-transform:uppercase;letter-spacing:0.06em;}
.s-div{width:1px;background:rgba(196,154,108,0.12);align-self:stretch;}

/* ══ KID VIEWS ══ */
.kid-view{min-height:400px;padding:0 0 20px;}

/* Notification */
.notif-banner{margin:10px 14px 0;border-radius:14px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px;}
.notif-judah{background:#EEF3FF;border:2px solid rgba(58,123,213,0.3);}
.notif-liam{background:#FFF0EE;border:2px solid rgba(232,84,58,0.3);}
.notif-icon{font-size:1.4rem;flex-shrink:0;}
.notif-body{flex:1;}
.notif-title{font-family:'Nunito',sans-serif;font-size:0.8rem;font-weight:900;margin-bottom:2px;}
.notif-judah .notif-title{color:var(--judah);}
.notif-liam .notif-title{color:var(--liam);}
.notif-msg{font-size:0.75rem;color:#666;line-height:1.4;}
.notif-pts{font-size:0.7rem;font-weight:700;color:#E8543A;margin-top:3px;}
.notif-close{font-size:0.7rem;color:#aaa;cursor:pointer;padding:2px 8px;border:1px solid #ddd;border-radius:8px;background:white;font-family:'DM Sans',sans-serif;margin-top:6px;display:inline-block;}

/* First kid banner */
.first-banner{margin:14px 14px 0;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,0.1);}
.first-banner.judah-first{background:linear-gradient(135deg,#3A7BD5,#2563C7);}
.first-banner.liam-first{background:linear-gradient(135deg,#E8543A,#C43B22);}
.first-banner-crown{font-size:2rem;}
.first-banner-info{flex:1;}
.first-banner-title{font-family:'Nunito',sans-serif;font-size:0.72rem;font-weight:800;color:rgba(255,255,255,0.8);text-transform:uppercase;letter-spacing:0.08em;}
.first-banner-name{font-family:'Nunito',sans-serif;font-size:1.3rem;font-weight:900;color:white;}
.first-banner-sub{font-size:0.7rem;color:rgba(255,255,255,0.75);margin-top:2px;}

/* Rotation info */
.week-info{margin:10px 14px 0;background:white;border-radius:14px;padding:10px 14px;border:0.5px solid rgba(196,154,108,0.15);}
.week-info-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.week-num{font-size:0.7rem;color:#888;}
.rotation-pills{display:flex;gap:6px;flex-wrap:wrap;}
.rot-pill{font-size:0.6rem;font-weight:700;padding:3px 8px;border-radius:20px;color:white;}
.rot-judah{background:var(--judah);}
.rot-liam{background:var(--liam);}

/* Mom overview */
.mom-overview{margin:10px 14px 0;background:white;border-radius:14px;padding:12px 14px;border:0.5px solid rgba(196,154,108,0.15);}
.mom-title{font-size:0.62rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--light);margin-bottom:10px;}
.mom-kids-row{display:flex;gap:10px;}
.mom-kid-card{flex:1;border-radius:12px;padding:10px;text-align:center;}
.mom-kid-card.j-card{background:#EEF3FF;border:2px solid rgba(58,123,213,0.2);}
.mom-kid-card.l-card{background:#FFF0EE;border:2px solid rgba(232,84,58,0.2);}
.mom-prog-track{background:rgba(0,0,0,0.08);border-radius:20px;height:6px;overflow:hidden;margin:4px 0 2px;}
.mom-prog-fill{height:100%;border-radius:20px;transition:width 0.4s;}
.j-fill{background:var(--judah);}
.l-fill{background:var(--liam);}
.mom-kid-name{font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:800;margin:5px 0 2px;}
.j-name{color:var(--judah);}
.l-name{color:var(--liam);}
.mom-pts{font-size:0.65rem;font-weight:700;color:#888;}
.flag-done{font-size:0.62rem;font-weight:700;color:var(--done);margin-top:3px;}
.flag-pending{font-size:0.62rem;font-weight:700;color:#E8543A;margin-top:3px;}
.remove-pts-btn{font-size:0.6rem;font-weight:700;padding:3px 8px;border-radius:8px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:5px;display:block;width:100%;}
.remove-j{background:rgba(58,123,213,0.12);color:var(--judah);}
.remove-l{background:rgba(232,84,58,0.12);color:var(--liam);}

/* Kid panel header */
.kid-panel-hdr{margin:12px 14px 0;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,0.08);}
.j-hdr{background:linear-gradient(135deg,#4A90E2,#3A7BD5);}
.l-hdr{background:linear-gradient(135deg,#FF6B6B,#E8543A);}
.kid-panel-info{flex:1;}
.kid-panel-name{font-family:'Nunito',sans-serif;font-size:1.2rem;font-weight:900;color:white;}
.kid-panel-sub{font-size:0.7rem;color:rgba(255,255,255,0.8);margin-top:1px;}
.kid-pts-badge{background:rgba(255,255,255,0.25);border-radius:20px;padding:3px 10px;font-family:'Nunito',sans-serif;font-size:0.75rem;font-weight:800;color:white;margin-top:5px;display:inline-block;}
.kid-prog-track{background:rgba(255,255,255,0.3);border-radius:20px;height:5px;overflow:hidden;margin-top:6px;}
.kid-prog-fill{height:100%;background:white;border-radius:20px;transition:width 0.4s;}
.kid-prog-txt{font-size:0.6rem;color:rgba(255,255,255,0.8);margin-top:2px;}

/* Time blocks — auto open */
.blocks-wrap{padding:10px 14px 0;}
.time-block{margin-bottom:10px;border-radius:14px;overflow:hidden;border:1px solid rgba(0,0,0,0.06);}
.time-block-hdr{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#F8F8F8;cursor:pointer;}
.time-block-icon{font-size:1rem;}
.time-block-title{font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:800;color:var(--dark);flex:1;}
.time-block-timing{font-size:0.6rem;color:#aaa;font-weight:600;}
.time-block-prog{font-size:0.65rem;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,0.06);color:#888;}
.time-block-chevron{font-size:0.65rem;color:#aaa;transition:transform 0.2s;}
.time-block.closed .time-block-chevron{transform:rotate(-90deg);}
.time-block-body{background:white;padding:8px 10px;}
.time-block.closed .time-block-body{display:none;}

/* Chore cards */
.chore-card{border-radius:12px;margin-bottom:7px;overflow:hidden;border:0.5px solid rgba(0,0,0,0.07);}
.chore-hdr{display:flex;align-items:center;padding:11px 13px;cursor:pointer;gap:9px;}
.j-chore .chore-hdr{background:#F0F6FF;}
.l-chore .chore-hdr{background:#FFF4F3;}
.no-pts-chore .chore-hdr{background:#F5F5F5;}
.chore-emoji{font-size:1.1rem;flex-shrink:0;}
.chore-info{flex:1;}
.chore-name{font-family:'Nunito',sans-serif;font-size:0.9rem;font-weight:800;color:var(--dark);}
.chore-name.struck{text-decoration:line-through;opacity:0.5;}
.chore-meta{display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap;}
.chore-badge{display:inline-block;font-size:0.52rem;font-weight:700;padding:2px 6px;border-radius:8px;text-transform:uppercase;letter-spacing:0.05em;}
.badge-daily{background:#E8F5E9;color:#2E7D32;}
.badge-weekly{background:#FFF3E0;color:#E65100;}
.badge-rotation{background:#F3E5F5;color:#6A1B9A;}
.badge-nopay{background:#F5F5F5;color:#999;}
.chore-pts-lbl{font-size:0.58rem;font-weight:700;color:#bbb;}
.chore-note{font-size:0.6rem;color:#aaa;font-style:italic;margin-top:1px;}
.chore-check-btn{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.95rem;flex-shrink:0;transition:all 0.2s;}
.j-chore .chore-check-btn{background:rgba(58,123,213,0.12);color:var(--judah);}
.l-chore .chore-check-btn{background:rgba(232,84,58,0.12);color:var(--liam);}
.no-pts-chore .chore-check-btn{background:rgba(0,0,0,0.07);color:#999;}
.chore-check-btn.checked{background:var(--done);color:white;transform:scale(1.1);}
.chore-expand{font-size:0.6rem;color:#bbb;transition:transform 0.2s;flex-shrink:0;}
.chore-card.open .chore-expand{transform:rotate(180deg);}

/* Subtasks */
.subtask-area{display:none;background:#FAFAFA;padding:7px 12px 10px;border-top:1px solid rgba(0,0,0,0.05);}
.chore-card.open .subtask-area{display:block;}
.subtask-list{list-style:none;}
.subtask-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.05);cursor:pointer;}
.subtask-item:last-child{border-bottom:none;}
.sub-chk{width:20px;height:20px;border-radius:5px;border:2px solid #ddd;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.65rem;transition:all 0.15s;}
.sub-chk.done{background:var(--done);border-color:var(--done);color:white;}
.sub-label{font-size:0.8rem;color:var(--dark);}
.sub-label.struck{text-decoration:line-through;opacity:0.5;}
.rule-card{background:#FFF8E1;border-radius:10px;padding:8px 12px;margin-bottom:7px;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,160,0,0.2);}
.rule-card-text{font-size:0.75rem;color:#E65100;font-weight:600;line-height:1.3;}
.photo-section{margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,0.06);}
.photo-sec-title{font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#aaa;margin-bottom:7px;}
.photo-grid{display:flex;gap:7px;flex-wrap:wrap;}
.photo-thumb{width:68px;height:68px;border-radius:10px;object-fit:cover;border:1px solid #eee;}
.photo-add-btn{width:68px;height:68px;border-radius:10px;border:2px dashed #ddd;background:#f9f9f9;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:0.58rem;color:#bbb;gap:2px;}
.pts-editor{display:flex;align-items:center;gap:7px;margin-top:8px;padding-top:7px;border-top:1px dashed rgba(0,0,0,0.08);}
.pts-label{font-size:0.7rem;color:#888;flex:1;}
.pts-input{width:50px;padding:4px 7px;border:1px solid #ddd;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:0.8rem;text-align:center;color:var(--dark);background:var(--cream);}
.pts-save-btn{padding:4px 9px;border:none;border-radius:7px;background:var(--done);color:white;font-family:'DM Sans',sans-serif;font-size:0.68rem;font-weight:600;cursor:pointer;}

/* Bonus chores */
.bonus-section{padding:0 14px;margin-top:12px;}
.bonus-title{font-family:'Nunito',sans-serif;font-size:0.9rem;font-weight:900;color:var(--dark);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.add-bonus-btn{font-size:0.68rem;font-weight:700;padding:4px 10px;border-radius:10px;border:none;background:var(--done);color:white;cursor:pointer;font-family:'Nunito',sans-serif;}
.bonus-card{background:white;border-radius:12px;border:0.5px solid rgba(58,158,95,0.2);padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px;}
.bonus-emoji{font-size:1.1rem;flex-shrink:0;}
.bonus-info{flex:1;}
.bonus-name{font-family:'Nunito',sans-serif;font-size:0.88rem;font-weight:800;color:var(--dark);}
.bonus-pts{font-size:0.62rem;font-weight:700;color:var(--done);}
.bonus-claim-btns{display:flex;gap:5px;}
.bonus-claim{font-size:0.62rem;font-weight:700;padding:5px 8px;border-radius:8px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;color:white;}
.bclaim-j{background:var(--judah);}
.bclaim-l{background:var(--liam);}
.bclaim-done{background:#ddd;color:#aaa;cursor:default;}
.bonus-delete{font-size:0.6rem;padding:3px 7px;border-radius:7px;border:1px solid #eee;background:transparent;color:#ccc;cursor:pointer;font-family:'DM Sans',sans-serif;}
.no-bonus{font-size:0.78rem;color:#aaa;text-align:center;padding:12px 0;}

/* Rewards */
.rewards-section{margin:12px 14px 0;}
.rewards-title{font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;color:var(--dark);margin-bottom:10px;}
.rewards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.reward-card{background:white;border-radius:14px;padding:12px;border:0.5px solid rgba(0,0,0,0.07);text-align:center;cursor:pointer;transition:transform 0.15s;}
.reward-card:active{transform:scale(0.97);}
.reward-emoji{font-size:1.8rem;margin-bottom:5px;}
.reward-name{font-family:'Nunito',sans-serif;font-size:0.8rem;font-weight:800;color:var(--dark);margin-bottom:2px;}
.reward-cost{font-size:0.66rem;font-weight:700;color:#aaa;}
.reward-cost span{color:var(--done);}
.add-reward-btn{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:2px dashed rgba(196,154,108,0.3);border-radius:14px;padding:12px;font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:700;color:var(--light);cursor:pointer;}

/* Backup */
.backup-bar{margin:14px 14px 0;background:white;border-radius:14px;padding:10px 14px;border:0.5px solid rgba(196,154,108,0.15);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.backup-label{font-size:0.7rem;color:#888;flex:1;}
.backup-btn{font-size:0.68rem;font-weight:600;padding:5px 12px;border-radius:10px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-export{background:#EEF3FF;color:var(--judah);}
.btn-import{background:#FFF3E0;color:var(--d);}

/* Confetti */
#cc{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;}

/* MODALS */
.modal-bg{display:none;background:rgba(44,26,14,0.5);position:fixed;inset:0;z-index:200;align-items:flex-end;justify-content:center;}
.modal-bg.on{display:flex;}
.modal-bg.center{align-items:center;}
.modal{background:white;border-radius:16px 16px 0 0;padding:18px 16px 36px;width:100%;max-width:500px;}
.modal h3{font-family:'DM Serif Display',serif;font-size:1rem;margin-bottom:12px;color:var(--dark);}
.modal input,.modal select,.modal textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.85rem;margin-bottom:9px;background:var(--cream);color:var(--dark);outline:none;}
.modal textarea{resize:none;height:70px;}
.modal-btns{display:flex;gap:8px;margin-top:4px;}
.btn-cancel{flex:1;padding:11px;border-radius:10px;border:1px solid #ddd;background:transparent;font-family:'DM Sans',sans-serif;font-size:0.85rem;color:#888;cursor:pointer;}
.btn-save{flex:2;padding:11px;border-radius:10px;border:none;background:var(--dark);font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:600;color:var(--cream);cursor:pointer;}
.picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.p-btn{padding:12px 8px;border-radius:10px;border:none;font-family:'DM Sans',sans-serif;font-size:0.8rem;font-weight:600;cursor:pointer;color:white;display:flex;align-items:center;gap:5px;}
.p-D{background:var(--d);}.p-C{background:var(--c);}.p-B{background:var(--b);}.p-PA{background:var(--pa);}
.p-none{background:#f0ebe4;color:#888;border:1px solid #ddd;grid-column:1/-1;}
.confirm-box{background:white;border-radius:14px;padding:20px 16px;width:88%;max-width:300px;text-align:center;margin:auto;}
.confirm-box h4{font-family:'DM Serif Display',serif;font-size:1rem;margin-bottom:6px;}
.confirm-box p{font-size:0.75rem;color:#888;margin-bottom:16px;line-height:1.5;}
.confirm-btns{display:flex;gap:8px;}
.cb-keep{flex:1;padding:9px;border-radius:8px;border:1px solid #ddd;background:transparent;font-family:'DM Sans',sans-serif;font-size:0.82rem;color:#888;cursor:pointer;}
.cb-del{flex:1;padding:9px;border-radius:8px;border:none;background:var(--d);font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:600;color:white;cursor:pointer;}
.redeem-box{background:white;border-radius:20px;padding:24px 20px;width:88%;max-width:340px;text-align:center;margin:auto;}
.redeem-emoji{font-size:3rem;margin-bottom:8px;}
.redeem-box h3{font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:900;margin-bottom:6px;}
.redeem-box p{font-size:0.8rem;color:#888;margin-bottom:16px;line-height:1.5;}
.redeem-kid-btns{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.redeem-kid-btn{padding:12px;border-radius:12px;border:none;font-family:'Nunito',sans-serif;font-size:0.9rem;font-weight:800;cursor:pointer;color:white;}
.redeem-j{background:var(--judah);}
.redeem-l{background:var(--liam);}
.redeem-cancel{background:transparent;border:1px solid #ddd;border-radius:12px;padding:10px;font-family:'DM Sans',sans-serif;font-size:0.85rem;color:#888;cursor:pointer;width:100%;}
.crop-box{background:white;border-radius:20px;padding:20px;width:92%;max-width:380px;margin:auto;}
.crop-box h3{font-family:'DM Serif Display',serif;font-size:1rem;margin-bottom:10px;text-align:center;}
.crop-canvas-wrap{width:200px;height:200px;border-radius:50%;overflow:hidden;margin:0 auto 12px;border:3px solid var(--light);cursor:grab;touch-action:none;}
#cropCanvas{display:block;}
.crop-hint{font-size:0.72rem;color:#aaa;text-align:center;margin-bottom:12px;}
.crop-zoom{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.crop-zoom label{font-size:0.72rem;color:#888;width:50px;}
.crop-zoom input{flex:1;}
.crop-btns{display:flex;gap:8px;}
.crop-cancel{flex:1;padding:10px;border-radius:10px;border:1px solid #ddd;background:transparent;font-family:'DM Sans',sans-serif;font-size:0.85rem;color:#888;cursor:pointer;}
.crop-save{flex:2;padding:10px;border-radius:10px;border:none;background:var(--dark);font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:600;color:var(--cream);cursor:pointer;}
</style>
</head>
<body>
<canvas id="cc"></canvas>

<div class="hdr">
  <h1>Bradberry Home</h1>
  <div class="hdr-right">
    <span class="ss" id="ss">Saved ✓</span>
    <button class="edit-btn" id="editBtn" onclick="toggleEdit()">Edit</button>
  </div>
</div>

<div class="main-tabs">
  <button class="main-tab on" id="tabToday" onclick="setMain('today')">Today</button>
  <button class="main-tab" id="tabWeek" onclick="setMain('week')">Week</button>
  <button class="main-tab judah-tab" id="tabJudah" onclick="setMain('judah')">👦🏽 Judah</button>
  <button class="main-tab liam-tab" id="tabLiam" onclick="setMain('liam')">👦🏾 Liam</button>
</div>

<div class="legend" id="adultLegend">
  <div class="leg"><div class="leg-dot" style="background:var(--d)">D</div>Dominique</div>
  <div class="leg"><div class="leg-dot" style="background:var(--c)">C</div>Cornell</div>
  <div class="leg"><div class="leg-dot" style="background:var(--b)">B</div>Both</div>
  <div class="leg"><div class="leg-dot" style="background:var(--pa)">PA</div>Asst.</div>
  <div class="leg"><div class="leg-dot" style="background:var(--done)">✓</div>Done</div>
</div>

<div id="todayView"></div>
<div id="weekView" style="display:none;"></div>
<div id="judahView" style="display:none;"></div>
<div id="liamView" style="display:none;"></div>

<div class="stats-bar" id="statsBar">
  <div class="stat"><span class="stat-num" id="sDone">0</span><span class="stat-lbl">Done today</span></div>
  <div class="s-div"></div>
  <div class="stat"><span class="stat-num" id="sD">0</span><span class="stat-lbl">Dominique</span></div>
  <div class="s-div"></div>
  <div class="stat"><span class="stat-num" id="sC">0</span><span class="stat-lbl">Cornell</span></div>
  <div class="s-div"></div>
  <div class="stat"><span class="stat-num" id="sB">0</span><span class="stat-lbl">Both</span></div>
  <div class="s-div"></div>
  <div class="stat"><span class="stat-num" id="sOpen">0</span><span class="stat-lbl">Open</span></div>
</div>

<!-- Adult picker -->
<div class="modal-bg" id="pickerBg">
  <div class="modal">
    <h3 id="pickerTitle">Assign task</h3>
    <p style="font-size:0.72rem;color:#888;margin-bottom:14px;" id="pickerSub"></p>
    <div class="picker-grid">
      <button class="p-btn p-D" onclick="assign('D')">👩🏽 Dominique</button>
      <button class="p-btn p-C" onclick="assign('C')">👨🏽 Cornell</button>
      <button class="p-btn p-B" onclick="assign('B')">🤝 Both</button>
      <button class="p-btn p-PA" onclick="assign('PA')">💼 Asst. (PA)</button>
      <button class="p-btn p-none" onclick="assign('none')">✕ Clear</button>
    </div>
  </div>
</div>

<!-- Add/Rename task -->
<div class="modal-bg" id="taskBg">
  <div class="modal">
    <h3 id="taskTitle">Add Task</h3>
    <input type="text" id="taskName" placeholder="Task name" />
    <select id="taskCat">
      <option>Kids &amp; Homeschool</option><option>Home &amp; Cleaning</option>
      <option>Meals &amp; Groceries</option><option>Errands &amp; Appointments</option>
      <option>Marriage &amp; Self</option><option>Business</option>
    </select>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeTask()">Cancel</button>
      <button class="btn-save" id="taskSave" onclick="saveTask()">Add</button>
    </div>
  </div>
</div>

<!-- Confirm delete -->
<div class="modal-bg center" id="confirmBg">
  <div class="confirm-box">
    <h4>Delete this task?</h4><p id="confirmTxt"></p>
    <div class="confirm-btns">
      <button class="cb-keep" onclick="closeConfirm()">Keep it</button>
      <button class="cb-del" onclick="doDelete()">Delete</button>
    </div>
  </div>
</div>

<!-- Redeem -->
<div class="modal-bg center" id="redeemBg">
  <div class="redeem-box">
    <div class="redeem-emoji" id="redeemEmoji"></div>
    <h3 id="redeemName"></h3>
    <p id="redeemDesc"></p>
    <div class="redeem-kid-btns">
      <button class="redeem-kid-btn redeem-j" id="redeemJBtn" onclick="doRedeem('judah')"></button>
      <button class="redeem-kid-btn redeem-l" id="redeemLBtn" onclick="doRedeem('liam')"></button>
    </div>
    <button class="redeem-cancel" onclick="closeRedeem()">Cancel</button>
  </div>
</div>

<!-- Add reward -->
<div class="modal-bg" id="rewardBg">
  <div class="modal">
    <h3>Add Reward</h3>
    <input type="text" id="rewardName" placeholder="Reward name" />
    <input type="text" id="rewardEmoji" placeholder="Emoji (e.g. 🎮)" />
    <input type="number" id="rewardCost" placeholder="Points needed (e.g. 20)" />
    <input type="text" id="rewardDesc" placeholder="Description (optional)" />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeReward()">Cancel</button>
      <button class="btn-save" onclick="saveReward()">Add</button>
    </div>
  </div>
</div>

<!-- Add bonus chore -->
<div class="modal-bg" id="bonusBg">
  <div class="modal">
    <h3>Add Bonus Chore</h3>
    <input type="text" id="bonusName" placeholder="Chore name (e.g. Help with groceries)" />
    <input type="text" id="bonusEmoji" placeholder="Emoji (e.g. 🛒)" />
    <input type="number" id="bonusPts" placeholder="Points (e.g. 5)" />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeBonusModal()">Cancel</button>
      <button class="btn-save" onclick="saveBonusChore()">Add</button>
    </div>
  </div>
</div>

<!-- Remove points -->
<div class="modal-bg" id="removePtsBg">
  <div class="modal">
    <h3 id="removePtsTitle">Take Away Points</h3>
    <input type="number" id="removePtsAmt" placeholder="How many points? (e.g. 3)" />
    <textarea id="removePtsReason" placeholder="Leave a message for them — they'll see it on their tab! (e.g. You brought your pillow downstairs 😬 Remember to leave it upstairs next time!)"></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeRemovePts()">Cancel</button>
      <button class="btn-save" onclick="doRemovePts()">Take Away</button>
    </div>
  </div>
</div>

<!-- Avatar crop -->
<div class="modal-bg center" id="cropBg">
  <div class="crop-box">
    <h3>Adjust Photo</h3>
    <div class="crop-canvas-wrap" id="cropWrap">
      <canvas id="cropCanvas" width="200" height="200"></canvas>
    </div>
    <p class="crop-hint">Drag to reposition · Use slider to zoom</p>
    <div class="crop-zoom">
      <label>Zoom</label>
      <input type="range" id="cropZoom" min="0.5" max="3" step="0.01" value="1" oninput="drawCrop()">
    </div>
    <div class="crop-btns">
      <button class="crop-cancel" onclick="closeCrop()">Cancel</button>
      <button class="crop-save" onclick="saveCrop()">Use This Photo</button>
    </div>
  </div>
</div>

<!-- File inputs -->
<input type="file" id="judahAvatarInput" style="display:none" accept="image/*" onchange="handleAvatar('judah',this)">
<input type="file" id="liamAvatarInput" style="display:none" accept="image/*" onchange="handleAvatar('liam',this)">
<input type="file" id="livingRoomPhotoInput" style="display:none" accept="image/*" onchange="handleExamplePhoto('livingRoom',this)">
<input type="file" id="bedroomPhotoInput" style="display:none" accept="image/*" onchange="handleExamplePhoto('bedroom',this)">
<input type="file" id="importInput" style="display:none" accept=".json" onchange="handleImport(this)">

<script>
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SECS=['Kids & Homeschool','Home & Cleaning','Meals & Groceries','Errands & Appointments','Marriage & Self','Business'];
const EMOJIS={'Kids & Homeschool':'🧒','Home & Cleaning':'🧹','Meals & Groceries':'🍽️','Errands & Appointments':'📋','Marriage & Self':'💛','Business':'💼'};
const OC={D:'#C2602A',C:'#4A7C6F',B:'#8B6BB1',PA:'#4A6FA5'};

const DEF_TASKS=[
  {id:1,name:"Homeschool",emoji:"📚",cat:"Kids & Homeschool",sched:{Mon:'D',Tue:'D',Wed:'D',Thu:'D',Fri:'D'}},
  {id:2,name:"Bedtime Routine",emoji:"🌙",cat:"Kids & Homeschool",sched:{Sun:'C',Mon:'C',Tue:'C',Wed:'C',Thu:'C',Fri:'C',Sat:'C'}},
  {id:3,name:"Boys' Showers",emoji:"🚿",cat:"Kids & Homeschool",sched:{}},
  {id:4,name:"Karate Pickup",emoji:"🥋",cat:"Kids & Homeschool",sched:{Wed:'none',Fri:'none'}},
  {id:5,name:"Haircuts",emoji:"✂️",cat:"Kids & Homeschool",sched:{}},
  {id:6,name:"Laundry",emoji:"👕",cat:"Home & Cleaning",sched:{}},
  {id:7,name:"Cleaning",emoji:"🧹",cat:"Home & Cleaning",sched:{}},
  {id:8,name:"Kitchen Tidy",emoji:"🏠",cat:"Home & Cleaning",sched:{}},
  {id:9,name:"Meal Plan",emoji:"📋",cat:"Meals & Groceries",sched:{Mon:'PA'}},
  {id:10,name:"Costco Run",emoji:"🛒",cat:"Meals & Groceries",sched:{Wed:'D'}},
  {id:11,name:"Aldi Pickup",emoji:"🛍️",cat:"Meals & Groceries",sched:{Thu:'PA'}},
  {id:12,name:"Cooking",emoji:"🍽️",cat:"Meals & Groceries",sched:{Mon:'D',Wed:'D',Sat:'D'}},
  {id:13,name:"Finances",emoji:"💰",cat:"Errands & Appointments",sched:{Mon:'PA'}},
  {id:14,name:"Appointments",emoji:"📅",cat:"Errands & Appointments",sched:{}},
  {id:15,name:"Personal Night",emoji:"🌿",cat:"Marriage & Self",sched:{}},
  {id:16,name:"Date Night",emoji:"💛",cat:"Marriage & Self",sched:{}},
  {id:17,name:"Work Block",emoji:"💼",cat:"Business",sched:{Mon:'B',Tue:'B',Wed:'B',Thu:'B',Fri:'B'}},
];

const DEF_CPTS={livingRoom:5,bedroom:5,laundry:2,breakfastTable:2,liamTrash:5,judahTrash:0,judahTrashOut:0,videoGame:3};
const DEF_REWARDS=[
  {id:1,emoji:'🎮',name:'Extra Screen Time',cost:15,desc:'30 extra minutes of video games'},
  {id:2,emoji:'🍔',name:'Lunch Out',cost:25,desc:'Pick your favorite lunch spot'},
  {id:3,emoji:'💵',name:'Cash Out',cost:20,desc:'$1 per 20 points'},
  {id:4,emoji:'🎬',name:'Movie Night Pick',cost:30,desc:'You choose the movie'},
  {id:5,emoji:'🎁',name:'Free Choice',cost:40,desc:'Request any reasonable reward'},
];

const weekNum=Math.ceil((new Date()-new Date(new Date().getFullYear(),0,1))/(7*24*3600*1000));
const isEvenWeek=weekNum%2===0;
const firstKid=isEvenWeek?'judah':'liam';
const judahRotChore=isEvenWeek?'bedroom':'livingRoom';
const liamRotChore=isEvenWeek?'livingRoom':'bedroom';

function getTimeBlocks(kid){
  const isJudah=kid==='judah';
  const todayDay=DAYS[new Date().getDay()];
  const isMon=todayDay==='Mon';
  const isSun=todayDay==='Sun';
  const cpts=chorePoints;
  const blocks=[
    {
      id:'morning',icon:'🌅',title:'Before School',timing:'by 9:00 AM',
      chores:[{id:'breakfastTable',name:'Wipe Breakfast Table',emoji:'🧽',type:'daily',pts:cpts.breakfastTable||2,subtasks:[],note:''}]
    },
    {
      id:'afterLunch',icon:'🌞',title:'After Lunch',timing:'before 1:00 PM',
      chores:[
        {id:'laundry',name:'Put Away Laundry',emoji:'👕',type:'daily',pts:cpts.laundry||2,subtasks:[],note:"Before Christian's nap at 1pm"},
        ...(isJudah?[{id:'videoGame',name:'Put Video Game Away',emoji:'🎮',type:'daily',pts:cpts.videoGame||3,subtasks:[],note:'Every afternoon'}]:[]),
        ...(isMon&&isJudah?[{id:'judahTrash',name:"Neighbor's Trash Cans — Back",emoji:'🗑️',type:'weekly',pts:0,subtasks:[],note:'Neighbor pays you for this one! 💰',noPay:true}]:[]),
        ...(isMon&&!isJudah?[{id:'liamTrash',name:'Trash & Recycling to Back',emoji:'🗑️',type:'weekly',pts:cpts.liamTrash||5,subtasks:[],note:'Bring both bins around back'}]:[]),
        ...(isSun&&isJudah?[{id:'judahTrashOut',name:"Neighbor's Trash Cans — Out",emoji:'🗑️',type:'weekly',pts:0,subtasks:[],note:'Put out for Monday pickup 💰',noPay:true}]:[]),
      ]
    },
    {
      id:'afterDinner',icon:'🌙',title:'After Dinner',timing:'evening',
      chores:[
        ...([{
          id:'livingRoom',name:'Clean Living Room',emoji:'🛋️',type:'rotation',pts:cpts.livingRoom||5,
          subtasks:['Put toys away','Vacuum the floor','Throw out trash'],
          note:'',photoKey:'livingRoom',assignedTo:judahRotChore==='livingRoom'?'judah':'liam'
        },{
          id:'bedroom',name:'Clean Bedroom',emoji:'🛏️',type:'rotation',pts:cpts.bedroom||5,
          subtasks:['Make the bed','Pick up clothes off floor','Put books & toys away','Tidy dresser top'],
          note:'',photoKey:'bedroom',assignedTo:judahRotChore==='bedroom'?'judah':'liam'
        }].filter(c=>c.assignedTo===kid)),
      ]
    },
  ];
  return blocks.filter(b=>b.chores.length>0);
}

// ── STATE ──────────────────────────────────────────────────────────
let tasks,adultDone={},kidsDone={},kidsSubDone={};
let points={judah:0,liam:0};
let chorePoints={...DEF_CPTS};
let rewards,bonusChores=[],bonusClaimed={};
let avatars={judah:null,liam:null};
let examplePhotos={livingRoom:[],bedroom:[]};
let notifications={judah:[],liam:[]};
let sec='All',editMode=false,mainView='today';
let pTarget=null,tMode='add',renameId=null,deleteId=null;
let redeemTarget=null,removePtsKid=null;
let cropKid=null,cropImg=null,cropX=0,cropY=0,cropScale=1;
let cropDragging=false,cropLastX=0,cropLastY=0;

const ti=new Date().getDay();
const td=DAYS[ti];
const todayStr=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

// ── STORAGE ────────────────────────────────────────────────────────
function load(){
  const today=new Date().toDateString();
  try{tasks=JSON.parse(localStorage.getItem('bb_tasks'))||DEF_TASKS;}catch(e){tasks=DEF_TASKS;}
  try{rewards=JSON.parse(localStorage.getItem('bb_rewards'))||DEF_REWARDS;}catch(e){rewards=DEF_REWARDS;}
  try{points=JSON.parse(localStorage.getItem('bb_points'))||{judah:0,liam:0};}catch(e){points={judah:0,liam:0};}
  try{chorePoints=JSON.parse(localStorage.getItem('bb_cpts'))||{...DEF_CPTS};}catch(e){chorePoints={...DEF_CPTS};}
  try{bonusChores=JSON.parse(localStorage.getItem('bb_bonus'))||[];}catch(e){bonusChores=[];}
  try{avatars=JSON.parse(localStorage.getItem('bb_avatars'))||{judah:null,liam:null};}catch(e){}
  try{examplePhotos=JSON.parse(localStorage.getItem('bb_photos'))||{livingRoom:[],bedroom:[]};}catch(e){}
  try{notifications=JSON.parse(localStorage.getItem('bb_notifs'))||{judah:[],liam:[]};}catch(e){notifications={judah:[],liam:[]};}
  try{const d=localStorage.getItem('bb_adone');const dt=localStorage.getItem('bb_adate');adultDone=(dt===today&&d)?JSON.parse(d):{};}catch(e){adultDone={};}
  try{const d=localStorage.getItem('bb_kdone');const dt=localStorage.getItem('bb_kdate');kidsDone=(dt===today&&d)?JSON.parse(d):{};}catch(e){kidsDone={};}
  try{const d=localStorage.getItem('bb_ksdone');const dt=localStorage.getItem('bb_ksdate');kidsSubDone=(dt===today&&d)?JSON.parse(d):{};}catch(e){kidsSubDone={};}
  try{const d=localStorage.getItem('bb_bclaimed');const dt=localStorage.getItem('bb_bcdate');bonusClaimed=(dt===today&&d)?JSON.parse(d):{};}catch(e){bonusClaimed={};}
  render();
}

function save(){
  const today=new Date().toDateString();
  try{
    localStorage.setItem('bb_tasks',JSON.stringify(tasks));
    localStorage.setItem('bb_rewards',JSON.stringify(rewards));
    localStorage.setItem('bb_points',JSON.stringify(points));
    localStorage.setItem('bb_cpts',JSON.stringify(chorePoints));
    localStorage.setItem('bb_bonus',JSON.stringify(bonusChores));
    localStorage.setItem('bb_avatars',JSON.stringify(avatars));
    localStorage.setItem('bb_photos',JSON.stringify(examplePhotos));
    localStorage.setItem('bb_notifs',JSON.stringify(notifications));
    localStorage.setItem('bb_adone',JSON.stringify(adultDone));localStorage.setItem('bb_adate',today);
    localStorage.setItem('bb_kdone',JSON.stringify(kidsDone));localStorage.setItem('bb_kdate',today);
    localStorage.setItem('bb_ksdone',JSON.stringify(kidsSubDone));localStorage.setItem('bb_ksdate',today);
    localStorage.setItem('bb_bclaimed',JSON.stringify(bonusClaimed));localStorage.setItem('bb_bcdate',today);
    document.getElementById('ss').textContent='Saved ✓';
  }catch(e){document.getElementById('ss').textContent='Save failed';}
}

function exportData(){
  const data={tasks,rewards,points,chorePoints,bonusChores,avatars,examplePhotos,notifications,adultDone,kidsDone,kidsSubDone,bonusClaimed,exportDate:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='bradberry-home-backup.json';a.click();URL.revokeObjectURL(url);
}
function handleImport(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.tasks)tasks=d.tasks;if(d.rewards)rewards=d.rewards;if(d.points)points=d.points;
      if(d.chorePoints)chorePoints=d.chorePoints;if(d.bonusChores)bonusChores=d.bonusChores;
      if(d.avatars)avatars=d.avatars;if(d.examplePhotos)examplePhotos=d.examplePhotos;
      if(d.notifications)notifications=d.notifications;
      save();render();alert('✅ Backup restored!');
    }catch(err){alert('❌ Could not read backup file.');}
  };
  reader.readAsText(file);input.value='';
}

// ── KIDS INTERACTIONS ──────────────────────────────────────────────
function toggleBlock(kid,blockId){
  const el=document.getElementById(`blk-${kid}-${blockId}`);
  if(el)el.classList.toggle('closed');
}

function toggleChoreCard(key,hasContent){
  if(!hasContent)return;
  document.getElementById('card-'+key)?.classList.toggle('open');
}

function toggleKidChore(kid,choreId,key,pts,noPay){
  const wasDone=kidsDone[key];
  kidsDone[key]=!wasDone;
  if(!wasDone&&!noPay){points[kid]=(points[kid]||0)+pts;launchConfetti();}
  else if(wasDone&&!noPay){points[kid]=Math.max(0,(points[kid]||0)-pts);}
  else if(!wasDone&&noPay){launchConfetti();}
  save();renderKidView('judah');renderKidView('liam');
}

function toggleSubtask(subKey,choreKey,kid,choreId,pts){
  kidsSubDone[subKey]=!kidsSubDone[subKey];
  const allChores=getTimeBlocks(kid).flatMap(b=>b.chores);
  const chore=allChores.find(c=>c.id===choreId);
  if(chore&&chore.subtasks.length){
    const allDone=chore.subtasks.every((_,i)=>kidsSubDone[choreKey+'_sub'+i]);
    if(allDone&&!kidsDone[choreKey]){
      kidsDone[choreKey]=true;
      if(!chore.noPay)points[kid]=(points[kid]||0)+pts;
      launchConfetti();
    }
  }
  if(kidsSubDone[subKey])launchStars();
  save();renderKidView('judah');renderKidView('liam');
}

function saveChorePoints(choreId,kid){
  const val=parseInt(document.getElementById(`pts_${kid}_${choreId}`)?.value)||0;
  chorePoints[choreId]=val;save();renderKidView('judah');renderKidView('liam');
}

function dismissNotif(kid,idx){
  notifications[kid].splice(idx,1);save();renderKidView(kid);
}

// ── REMOVE POINTS ──────────────────────────────────────────────────
function openRemovePts(kid){
  removePtsKid=kid;
  const name=kid==='judah'?'Judah':'Liam';
  document.getElementById('removePtsTitle').textContent=`Take Away Points from ${name}`;
  document.getElementById('removePtsAmt').value='';
  document.getElementById('removePtsReason').value='';
  document.getElementById('removePtsBg').classList.add('on');
}
function doRemovePts(){
  const amt=parseInt(document.getElementById('removePtsAmt').value)||0;
  const reason=document.getElementById('removePtsReason').value.trim();
  if(!amt)return;
  points[removePtsKid]=Math.max(0,(points[removePtsKid]||0)-amt);
  if(reason){
    if(!notifications[removePtsKid])notifications[removePtsKid]=[];
    notifications[removePtsKid].push({msg:reason,pts:amt});
  }
  closeRemovePts();save();renderKidView('judah');renderKidView('liam');
}
function closeRemovePts(){document.getElementById('removePtsBg').classList.remove('on');removePtsKid=null;}

// ── BONUS CHORES ───────────────────────────────────────────────────
function openBonusModal(){document.getElementById('bonusBg').classList.add('on');}
function closeBonusModal(){document.getElementById('bonusBg').classList.remove('on');}
function saveBonusChore(){
  const name=document.getElementById('bonusName').value.trim();
  const emoji=document.getElementById('bonusEmoji').value.trim()||'⭐';
  const pts=parseInt(document.getElementById('bonusPts').value)||5;
  if(!name)return;
  bonusChores.push({id:'bonus_'+Date.now(),name,emoji,pts});
  closeBonusModal();
  ['bonusName','bonusEmoji','bonusPts'].forEach(id=>document.getElementById(id).value='');
  save();renderKidView('judah');renderKidView('liam');
}
function claimBonus(bonusId,kid){
  const key=bonusId+'_'+kid;if(bonusClaimed[key])return;
  bonusClaimed[key]=true;
  const b=bonusChores.find(x=>x.id===bonusId);
  if(b){points[kid]=(points[kid]||0)+b.pts;launchConfetti();}
  save();renderKidView('judah');renderKidView('liam');
}
function deleteBonus(bonusId){
  bonusChores=bonusChores.filter(b=>b.id!==bonusId);
  save();renderKidView('judah');renderKidView('liam');
}

// ── PHOTOS / AVATARS ───────────────────────────────────────────────
function handleAvatar(kid,input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    cropKid=kid;cropImg=new Image();
    cropImg.onload=()=>{cropX=0;cropY=0;cropScale=1;document.getElementById('cropZoom').value=1;drawCrop();document.getElementById('cropBg').classList.add('on');};
    cropImg.src=e.target.result;
  };
  reader.readAsDataURL(file);input.value='';
}
function drawCrop(){
  const canvas=document.getElementById('cropCanvas');const ctx=canvas.getContext('2d');
  const size=200;ctx.clearRect(0,0,size,size);if(!cropImg)return;
  const iw=cropImg.width,ih=cropImg.height;
  const scale=cropScale*(size/Math.min(iw,ih));
  const dw=iw*scale,dh=ih*scale;
  ctx.drawImage(cropImg,(size-dw)/2+cropX,(size-dh)/2+cropY,dw,dh);
}
function saveCrop(){
  avatars[cropKid]=document.getElementById('cropCanvas').toDataURL('image/jpeg',0.85);
  closeCrop();save();renderKidView('judah');renderKidView('liam');
}
function closeCrop(){document.getElementById('cropBg').classList.remove('on');cropKid=null;cropImg=null;}

const cw=document.getElementById('cropWrap');
cw.addEventListener('mousedown',e=>{cropDragging=true;cropLastX=e.clientX;cropLastY=e.clientY;});
cw.addEventListener('touchstart',e=>{cropDragging=true;const t=e.touches[0];cropLastX=t.clientX;cropLastY=t.clientY;},{passive:true});
window.addEventListener('mousemove',e=>{if(!cropDragging)return;cropX+=e.clientX-cropLastX;cropY+=e.clientY-cropLastY;cropLastX=e.clientX;cropLastY=e.clientY;drawCrop();});
window.addEventListener('touchmove',e=>{if(!cropDragging)return;const t=e.touches[0];cropX+=t.clientX-cropLastX;cropY+=t.clientY-cropLastY;cropLastX=t.clientX;cropLastY=t.clientY;drawCrop();},{passive:true});
window.addEventListener('mouseup',()=>{cropDragging=false;});
window.addEventListener('touchend',()=>{cropDragging=false;});
document.getElementById('cropZoom').addEventListener('input',function(){cropScale=parseFloat(this.value);drawCrop();});

function handleExamplePhoto(key,input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{if(!examplePhotos[key])examplePhotos[key]=[];examplePhotos[key].push(e.target.result);save();renderKidView('judah');renderKidView('liam');};
  reader.readAsDataURL(file);input.value='';
}

// ── REWARDS ────────────────────────────────────────────────────────
function openRedeem(rewardId){
  redeemTarget=rewards.find(r=>r.id===rewardId);if(!redeemTarget)return;
  document.getElementById('redeemEmoji').textContent=redeemTarget.emoji;
  document.getElementById('redeemName').textContent=redeemTarget.name;
  document.getElementById('redeemDesc').textContent=redeemTarget.desc+` — costs ⭐ ${redeemTarget.cost} points`;
  document.getElementById('redeemJBtn').textContent=`Judah (⭐ ${points.judah} pts)`;
  document.getElementById('redeemLBtn').textContent=`Liam (⭐ ${points.liam} pts)`;
  document.getElementById('redeemBg').classList.add('on');
}
function doRedeem(kid){
  if(!redeemTarget)return;
  if(points[kid]<redeemTarget.cost){alert(`Not enough points! Need ⭐ ${redeemTarget.cost} but only have ⭐ ${points[kid]}.`);return;}
  points[kid]-=redeemTarget.cost;
  save();closeRedeem();renderKidView('judah');renderKidView('liam');launchConfetti();
  setTimeout(()=>alert(`🎉 ${kid==='judah'?'Judah':'Liam'} redeemed: ${redeemTarget.name}! Don't forget to approve it.`),300);
}
function closeRedeem(){document.getElementById('redeemBg').classList.remove('on');redeemTarget=null;}
function openReward(){document.getElementById('rewardBg').classList.add('on');}
function saveReward(){
  const name=document.getElementById('rewardName').value.trim();
  const emoji=document.getElementById('rewardEmoji').value.trim()||'🎁';
  const cost=parseInt(document.getElementById('rewardCost').value)||10;
  const desc=document.getElementById('rewardDesc').value.trim();
  if(!name)return;
  rewards.push({id:Math.max(...rewards.map(r=>r.id),0)+1,emoji,name,cost,desc});
  closeReward();save();renderKidView('judah');renderKidView('liam');
}
function closeReward(){document.getElementById('rewardBg').classList.remove('on');}

// ── CONFETTI ───────────────────────────────────────────────────────
function launchConfetti(){
  const canvas=document.getElementById('cc');const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const colors=['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#FF922B','#CC5DE8','#3A7BD5','#E8543A'];
  const pieces=Array.from({length:130},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height-canvas.height,w:Math.random()*12+5,h:Math.random()*7+3,color:colors[Math.floor(Math.random()*colors.length)],r:Math.random()*Math.PI*2,vy:Math.random()*5+2,vx:(Math.random()-0.5)*4,vr:(Math.random()-0.5)*0.25}));
  let frame=0;
  function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});if(++frame<90)requestAnimationFrame(animate);else ctx.clearRect(0,0,canvas.width,canvas.height);}
  animate();
}
function launchStars(){
  const canvas=document.getElementById('cc');const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const stars=Array.from({length:18},()=>({x:Math.random()*canvas.width,y:canvas.height*0.5+Math.random()*150,r:Math.random()*10+6,alpha:1,vy:-(Math.random()*3+1)}));
  let f=0;
  function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);stars.forEach(s=>{s.y+=s.vy;s.alpha-=0.04;ctx.save();ctx.globalAlpha=Math.max(0,s.alpha);ctx.font=`${s.r*2}px serif`;ctx.fillText('⭐',s.x,s.y);ctx.restore();});if(++f<35)requestAnimationFrame(animate);else ctx.clearRect(0,0,canvas.width,canvas.height);}
  animate();
}

// ── ADULT ACTIONS ──────────────────────────────────────────────────
function toggleAdultDone(id,day){const k=id+'_'+day;adultDone[k]=!adultDone[k];save();renderToday();renderWeek();updateStats();}
function resetAdultToday(){tasks.forEach(t=>{delete adultDone[t.id+'_'+td];});save();renderToday();updateStats();}
function setSec(s){sec=s;renderWeek();}
function openPicker(id,day){pTarget={id,day};const t=tasks.find(t=>t.id===id);document.getElementById('pickerTitle').textContent=t.name;document.getElementById('pickerSub').textContent='Assign for '+day;document.getElementById('pickerBg').classList.add('on');}
function assign(owner){if(!pTarget)return;const t=tasks.find(t=>t.id===pTarget.id);if(owner==='none')delete t.sched[pTarget.day];else t.sched[pTarget.day]=owner;closePicker();save();render();}
function closePicker(){document.getElementById('pickerBg').classList.remove('on');pTarget=null;}
function openAdd(){tMode='add';document.getElementById('taskTitle').textContent='Add New Task';document.getElementById('taskSave').textContent='Add';document.getElementById('taskName').value='';document.getElementById('taskBg').classList.add('on');}
function openRename(id){renameId=id;tMode='rename';const t=tasks.find(t=>t.id===id);document.getElementById('taskTitle').textContent='Rename Task';document.getElementById('taskSave').textContent='Save';document.getElementById('taskName').value=t.name;document.getElementById('taskCat').value=t.cat;document.getElementById('taskBg').classList.add('on');}
function saveTask(){const name=document.getElementById('taskName').value.trim();const cat=document.getElementById('taskCat').value;if(!name)return;if(tMode==='add'){const newId=Math.max(...tasks.map(t=>t.id),0)+1;tasks.push({id:newId,name,emoji:EMOJIS[cat]||'📌',cat,sched:{}});}else{const t=tasks.find(t=>t.id===renameId);t.name=name;t.cat=cat;}closeTask();save();render();}
function closeTask(){document.getElementById('taskBg').classList.remove('on');renameId=null;}
function openConfirm(id){deleteId=id;const t=tasks.find(t=>t.id===id);document.getElementById('confirmTxt').textContent='"'+t.name+'" will be removed permanently.';document.getElementById('confirmBg').classList.add('on');}
function doDelete(){tasks=tasks.filter(t=>t.id!==deleteId);closeConfirm();save();render();}
function closeConfirm(){document.getElementById('confirmBg').classList.remove('on');deleteId=null;}

function updateStats(){
  let d=0,c=0,b=0,open=0,dc=0;
  tasks.forEach(t=>{let any=false;DAYS.forEach(day=>{const o=t.sched[day];if(o&&o!=='none'){if(o==='D')d++;else if(o==='C')c++;else if(o==='B')b++;any=true;if(adultDone[t.id+'_'+day])dc++;}});if(!any)open++;});
  document.getElementById('sDone').textContent=dc;document.getElementById('sD').textContent=d;
  document.getElementById('sC').textContent=c;document.getElementById('sB').textContent=b;
  document.getElementById('sOpen').textContent=open;
}

['pickerBg','taskBg','confirmBg','redeemBg','rewardBg','bonusBg','removePtsBg','cropBg'].forEach(id=>{
  document.getElementById(id)?.addEventListener('click',function(e){if(e.target===this)this.classList.remove('on');});
});

load();
